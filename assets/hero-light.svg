<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>System Map</title>
  <!-- The store hero, 16:9. The icon's layers opened up, on a blueprint grid. -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#134a9c" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#f4f7fc"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <path d="M330 270V285H207V300M330 285H452V300M207 400V415H178V430M207 415H330V430M452 400V415H482V430" fill="none" stroke="#134a9c" stroke-opacity=".35" stroke-width="4"/>
  <g fill="#134a9c">
    <rect x="120" y="170" width="420" height="100" rx="18"/>
    <rect x="100" y="300" width="215" height="100" rx="18"/>
    <rect x="345" y="300" width="215" height="100" rx="18"/>
    <rect x="120" y="430" width="116" height="100" rx="18"/>
    <rect x="272" y="430" width="116" height="100" rx="18"/>
  </g>
  <rect x="424" y="430" width="116" height="100" rx="18" fill="#ffc53d"/>
  <g font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="620" y="318" font-size="70" font-weight="700" fill="#0f2747">System Map</text>
    <text x="622" y="372" font-size="28" fill="#34507a">Your system, read from your repo.</text>
    <text x="622" y="422" font-size="22" fill="#5b7398">Map · Data model · Risk · Worktrees · Agents</text>
  </g>
</svg>
