<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>System Map dev harness</title>
    <style>
      :root {
        --bg: #fafafa; --bg-elevated: #fff; --bg-hover: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a;
        --border: #e4e4e7; --border-strong: #a1a1aa; --accent: #2f7d5c; --accent-fg: #fff;
        --accent-subtle: rgba(47, 125, 92, 0.18); --danger: #dc2626; --warn-text: #b45309;
        --mono: ui-monospace, Menlo, monospace;
      }
      html.dark {
        --bg: #18181b; --bg-elevated: #27272a; --bg-hover: #2f2f33; --card: #212124; --text: #f4f4f5; --muted: #a1a1aa;
        --border: #3f3f46; --border-strong: #71717a; --accent: #4fb88a; --accent-fg: #0b1f16;
        --accent-subtle: rgba(79, 184, 138, 0.2); --danger: #f87171; --warn-text: #fbbf24;
      }
      html, body, #root { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
